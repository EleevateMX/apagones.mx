<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>ApagonesMID maskable</title>
  <defs>
    <radialGradient id="mBg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8A1228"/>
      <stop offset="55%" stop-color="#65081F"/>
      <stop offset="100%" stop-color="#3A0412"/>
    </radialGradient>
    <linearGradient id="mBolt" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E8970A"/>
    </linearGradient>
    <linearGradient id="mGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full bleed background (no rounded corners — OS will mask) -->
  <rect width="120" height="120" fill="url(#mBg)"/>
  <path d="M0 0H120V42Q60 56 0 42Z" fill="url(#mGloss)" opacity="0.55"/>
  <!-- Bolt centered inside 80% safe zone (12px padding) — scaled down to 0.78 -->
  <g transform="translate(60 60) scale(0.78) translate(-60 -60)">
    <ellipse cx="60" cy="62" rx="28" ry="34" fill="#FFD700" opacity="0.1"/>
    <path d="M73 10L42 58H62L47 110L86 54H66Z" fill="url(#mBolt)" filter="url(#mGlow)"/>
    <path d="M66 20L50 52H64L52 92" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
